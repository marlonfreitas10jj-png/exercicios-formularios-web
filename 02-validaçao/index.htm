<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro com validação</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="container">
        <form>
            <h1>Cadastro</h1>

            <label for="nome">Nome</label>
            <input
                type="text"
                id="nome"
                name="nome"
                required
                minlength="3"
            >

            <label for="email">E-mail</label>
            <input
                type="email"
                id="email"
                name="email"
                required
                placeholder="seuemail@email.com"
            >

            <label for="senha">Senha</label>
            <input
                type="password"
                id="senha"
                name="senha"
                required
                minlength="8"
                pattern="(?=.*[A-Z])(?=.*[a-z])(?=.*[0-9]).{8,}"
                title="A senha deve ter pelo menos 8 caracteres, incluindo maiúscula, minúscula e número."
            >

            <button type="submit">Cadastrar</button>
        </form>
    </main>

</body>
</html>
